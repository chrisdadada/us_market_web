<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1900" viewBox="0 0 1440 1900">
  <defs>
    <style>
      .bg{fill:#f5f7fa}.paper{fill:#fff;stroke:#dce5ee;stroke-width:1.2}
      .muted{fill:#667286;font-size:15px;font-weight:700}.tiny{fill:#8591a2;font-size:12px;font-weight:700}
      .eyebrow{fill:#2f6796;font-size:13px;font-weight:900}.title{fill:#142033;font-size:30px;font-weight:950}
      .h1{fill:#142033;font-size:36px;font-weight:950}.h2{fill:#142033;font-size:22px;font-weight:950}
      .label{fill:#667286;font-size:13px;font-weight:900}.num{fill:#142033;font-size:44px;font-weight:950}
      .blue{fill:#2f6796}.green{fill:#12805c}.amber{fill:#a56b12}.red{fill:#bd2d2a}
      .line{stroke:#dce5ee;stroke-width:1}.axis{stroke:#d3dde8;stroke-width:1;stroke-dasharray:6 8}
      .chartline{fill:none;stroke:#2f6796;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .chartline2{fill:none;stroke:#c77a30;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .area{fill:url(#areaBlue)}.area2{fill:url(#areaAmber)}
      .chip{fill:#eef4f9;stroke:#d8e5ef}.chipText{fill:#2f6796;font-size:13px;font-weight:900}
      .shadow{filter:drop-shadow(0 16px 38px rgba(45,78,108,.08))}
    </style>
    <linearGradient id="areaBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6796" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2f6796" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="areaAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c77a30" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#c77a30" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1440" height="1900"/>
  <rect x="64" y="50" width="1312" height="100" rx="24" class="paper shadow"/>
  <text x="100" y="92" class="eyebrow">MACRO INDICATORS</text>
  <text x="100" y="126" class="title">宏观指标历史走势</text>
  <text x="360" y="124" class="muted">每个指标独立成图，用历史分位判断当前水平，不做成小卡片。</text>
  <rect x="1168" y="82" width="160" height="38" rx="19" class="chip"/>
  <text x="1200" y="106" class="chipText">近5年视图</text>

  <!-- VIX -->
  <g class="shadow">
    <rect x="64" y="190" width="1312" height="430" rx="26" class="paper"/>
    <text x="100" y="240" class="eyebrow">市场波动</text>
    <text x="100" y="282" class="h1">VIX 波动率</text>
    <text x="100" y="314" class="muted">衡量市场预期波动，数值越高代表市场越紧张。</text>
    <text x="100" y="374" class="label">当前结论</text>
    <text x="100" y="416" class="num green">低波动区间</text>
    <text x="100" y="472" class="label">当前值</text>
    <text x="100" y="520" class="num">17.26</text>
    <text x="246" y="520" class="muted">近5年分位 45% · 更新至 2026-05-14</text>
    <rect x="100" y="548" width="86" height="30" rx="15" class="chip"/><text x="120" y="568" class="chipText">1年</text>
    <rect x="196" y="548" width="86" height="30" rx="15" fill="#2f6796"/><text x="216" y="568" fill="#fff" font-size="13" font-weight="900">3年</text>
    <rect x="292" y="548" width="86" height="30" rx="15" class="chip"/><text x="312" y="568" class="chipText">5年</text>
    <line class="axis" x1="540" y1="268" x2="1310" y2="268"/><line class="axis" x1="540" y1="342" x2="1310" y2="342"/><line class="axis" x1="540" y1="416" x2="1310" y2="416"/>
    <text x="1244" y="260" class="tiny">70%分位</text><text x="1248" y="334" class="tiny">中位值</text><text x="1244" y="408" class="tiny">30%分位</text>
    <path class="area" d="M540 372 C580 320 602 346 628 300 C662 366 704 356 740 380 C790 410 828 352 860 390 C900 420 946 386 980 340 C1020 286 1058 250 1094 296 C1134 232 1176 202 1214 302 C1240 356 1278 344 1310 360 L1310 486 L540 486 Z"/>
    <path class="chartline" d="M540 372 C580 320 602 346 628 300 C662 366 704 356 740 380 C790 410 828 352 860 390 C900 420 946 386 980 340 C1020 286 1058 250 1094 296 C1134 232 1176 202 1214 302 C1240 356 1278 344 1310 360"/>
    <circle cx="1310" cy="360" r="5" fill="#2f6796"/>
    <text x="540" y="526" class="tiny">2023-05</text><text x="1020" y="526" class="tiny">2025-05</text><text x="1250" y="526" class="tiny">2026-05</text>
  </g>

  <!-- Rates -->
  <g class="shadow">
    <rect x="64" y="660" width="1312" height="430" rx="26" class="paper"/>
    <text x="100" y="710" class="eyebrow">利率压力</text>
    <text x="100" y="752" class="h1">10年期 / 30年期美债收益率</text>
    <text x="100" y="784" class="muted">观察成长股估值、长期资金成本和高估值资产压力。</text>
    <text x="100" y="848" class="label">10年期</text>
    <text x="100" y="898" class="num amber">4.47%</text>
    <text x="262" y="898" class="muted">近5年分位 91%</text>
    <text x="100" y="960" class="label">30年期</text>
    <text x="100" y="1010" class="num red">5.02%</text>
    <text x="262" y="1010" class="muted">近5年分位 99%</text>
    <line class="axis" x1="540" y1="740" x2="1310" y2="740"/><line class="axis" x1="540" y1="826" x2="1310" y2="826"/><line class="axis" x1="540" y1="912" x2="1310" y2="912"/>
    <text x="1244" y="732" class="tiny">70%分位</text><text x="1248" y="818" class="tiny">中位值</text><text x="1244" y="904" class="tiny">30%分位</text>
    <path class="area2" d="M540 946 C606 916 650 872 714 836 C780 798 828 760 884 742 C944 724 998 760 1050 714 C1110 666 1188 650 1244 694 C1274 718 1296 702 1310 686 L1310 1014 L540 1014 Z"/>
    <path class="chartline2" d="M540 946 C606 916 650 872 714 836 C780 798 828 760 884 742 C944 724 998 760 1050 714 C1110 666 1188 650 1244 694 C1274 718 1296 702 1310 686"/>
    <path class="chartline" d="M540 982 C600 940 662 900 724 864 C790 822 836 790 898 776 C956 762 1006 798 1060 756 C1124 712 1198 690 1256 728 C1284 748 1300 732 1310 724"/>
    <text x="540" y="1058" class="tiny">2021-05</text><text x="1250" y="1058" class="tiny">2026-05</text>
  </g>

  <!-- Dollar -->
  <g class="shadow">
    <rect x="64" y="1130" width="1312" height="330" rx="26" class="paper"/>
    <text x="100" y="1180" class="eyebrow">全球资金偏好</text>
    <text x="100" y="1222" class="h1">美元指数</text>
    <text x="100" y="1254" class="muted">美元偏强时，黄金、大宗商品、海外收入公司和风险资产都需要观察。</text>
    <text x="100" y="1328" class="num">118.04</text>
    <text x="100" y="1370" class="muted">近5年分位 22% · 当前处在偏强但回落后的区间</text>
    <line class="axis" x1="540" y1="1200" x2="1310" y2="1200"/><line class="axis" x1="540" y1="1268" x2="1310" y2="1268"/><line class="axis" x1="540" y1="1336" x2="1310" y2="1336"/>
    <path class="area" d="M540 1196 C598 1230 624 1264 678 1282 C736 1300 786 1260 838 1274 C894 1290 934 1246 988 1238 C1048 1228 1088 1288 1146 1328 C1200 1366 1248 1310 1310 1350 L1310 1408 L540 1408 Z"/>
    <path class="chartline" d="M540 1196 C598 1230 624 1264 678 1282 C736 1300 786 1260 838 1274 C894 1290 934 1246 988 1238 C1048 1228 1088 1288 1146 1328 C1200 1366 1248 1310 1310 1350"/>
  </g>

  <!-- Oil/CPI -->
  <g class="shadow">
    <rect x="64" y="1500" width="636" height="330" rx="26" class="paper"/>
    <text x="100" y="1550" class="eyebrow">通胀与成本</text>
    <text x="100" y="1590" class="h1">Brent 原油</text>
    <text x="100" y="1622" class="muted">油价偏高时，通胀和企业成本压力可能回升。</text>
    <text x="100" y="1690" class="num amber">$106.11</text>
    <text x="100" y="1730" class="muted">近5年分位 90% · 高位观察</text>
    <line class="axis" x1="320" y1="1582" x2="656" y2="1582"/><line class="axis" x1="320" y1="1650" x2="656" y2="1650"/><line class="axis" x1="320" y1="1718" x2="656" y2="1718"/>
    <path class="area2" d="M320 1750 C360 1718 392 1682 430 1658 C470 1630 506 1664 540 1608 C574 1552 612 1582 656 1548 L656 1784 L320 1784 Z"/>
    <path class="chartline2" d="M320 1750 C360 1718 392 1682 430 1658 C470 1630 506 1664 540 1608 C574 1552 612 1582 656 1548"/>
  </g>

  <g class="shadow">
    <rect x="740" y="1500" width="636" height="330" rx="26" class="paper"/>
    <text x="776" y="1550" class="eyebrow">通胀趋势</text>
    <text x="776" y="1590" class="h1">CPI 同比</text>
    <text x="776" y="1622" class="muted">观察通胀压力、降息预期和利率敏感资产环境。</text>
    <text x="776" y="1690" class="num red">3.95%</text>
    <text x="776" y="1730" class="muted">近5年分位 57% · 高于目标区间</text>
    <line class="axis" x1="996" y1="1582" x2="1332" y2="1582"/><line class="axis" x1="996" y1="1650" x2="1332" y2="1650"/><line class="axis" x1="996" y1="1718" x2="1332" y2="1718"/>
    <path class="area" d="M996 1760 C1038 1704 1080 1600 1122 1542 C1166 1488 1208 1530 1248 1600 C1288 1670 1308 1708 1332 1668 L1332 1784 L996 1784 Z"/>
    <path class="chartline" d="M996 1760 C1038 1704 1080 1600 1122 1542 C1166 1488 1208 1530 1248 1600 C1288 1670 1308 1708 1332 1668"/>
  </g>
</svg>
