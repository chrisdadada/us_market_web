  <!-- Mobile treatment -->
  <g class="shadow">
    <rect x="64" y="1310" width="1312" height="318" rx="8" class="sheet"/>
    <text x="96" y="1362" class="smallTitle ink">移动端处理示意</text>
    <text x="96" y="1394" class="body sub">左侧结论区上移为指标摘要；图表保留完整 x/y 坐标，右侧分位标签改为图下三行说明，当前值贴近右上角但在 plot 外。</text>
    <rect x="96" y="1430" width="270" height="46" rx="4" fill="#f8fafc" stroke="#d9e0e8"/>
    <text x="116" y="1458" class="body ink">1年 / 3年 / 5年</text>
    <text x="96" y="1524" class="tiny muted">移动端原则</text>
    <text x="96" y="1554" class="body sub">1. 不隐藏坐标；减少 tick 数量。</text>
    <text x="96" y="1584" class="body sub">2. 分位线标签离开折线区，避免遮挡。</text>
    <text x="96" y="1614" class="body sub">3. 当前值 callout 固定在图外信息栏。</text>

