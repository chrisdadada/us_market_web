<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1720" viewBox="0 0 1440 1720">
  <defs>
    <style>
      *{box-sizing:border-box}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .bg{fill:#f4f6f8}.sheet{fill:#fff;stroke:#d9e0e8;stroke-width:1}.band{fill:#f8fafc}
      .ink{fill:#111827}.sub{fill:#5f6b7a}.muted{fill:#8290a3}.faint{fill:#a0acba}
      .title{font-size:26px;font-weight:800}.smallTitle{font-size:20px;font-weight:800}.body{font-size:14px;font-weight:600}
      .tiny{font-size:12px;font-weight:650}.micro{font-size:11px;font-weight:650}
      .metric{font-size:38px;font-weight:850}.value{font-size:30px;font-weight:850}
      .axis{stroke:#d9e0e8;stroke-width:1}.grid{stroke:#e6ebf1;stroke-width:1}.ref{stroke:#aeb9c7;stroke-width:1.2;stroke-dasharray:5 6}
      .lineBlue{fill:none;stroke:#245f9f;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .lineTeal{fill:none;stroke:#16846f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .lineAmber{fill:none;stroke:#b46b24;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .areaBlue{fill:url(#blueArea)}.areaTeal{fill:url(#tealArea)}
      .blue{fill:#245f9f}.teal{fill:#16846f}.amber{fill:#9a5b18}.red{fill:#a23a3a}
      .chip{fill:#f3f6f9;stroke:#d9e0e8;stroke-width:1}.chipOn{fill:#1f2937}.chipText{fill:#475569;font-size:12px;font-weight:750}.chipOnText{fill:#fff;font-size:12px;font-weight:750}
      .labelBox{fill:#fff;stroke:#cfd8e3;stroke-width:1}.callout{fill:#fff;stroke:#b9c6d6;stroke-width:1.2}.shadow{filter:drop-shadow(0 16px 34px rgba(23,42,69,.08))}
    </style>
    <linearGradient id="blueArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#245f9f" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#245f9f" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="tealArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16846f" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#16846f" stop-opacity=".02"/>
    </linearGradient>
    <clipPath id="plotClip"><rect x="438" y="238" width="688" height="326"/></clipPath>
    <clipPath id="plotClip2"><rect x="438" y="826" width="688" height="326"/></clipPath>
    <clipPath id="mobilePlot"><rect x="832" y="1326" width="392" height="206"/></clipPath>
  </defs>

  <rect class="bg" width="1440" height="1720"/>

  <text x="72" y="72" class="title ink">宏观指标历史走势图 · 专业版 V2</text>
  <text x="72" y="102" class="body sub">参考 FRED、TradingView、Koyfin 与机构研究报告图表语法：完整坐标、清晰图例、分位线独立标注、当前值不压线。</text>
  <text x="1124" y="76" class="tiny muted">Design mockup only</text>
  <text x="1124" y="98" class="tiny muted">Do not deploy</text>

  <!-- Chart 1 -->
