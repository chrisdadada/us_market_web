    <text x="1164" y="242" class="tiny muted">36</text><text x="1164" y="307" class="tiny muted">30</text><text x="1164" y="372" class="tiny muted">24</text><text x="1164" y="437" class="tiny muted">18</text><text x="1164" y="502" class="tiny muted">12</text><text x="1164" y="568" class="tiny muted">6</text>
